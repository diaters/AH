[package]
name = "harness"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
dotenvy = "0.15"
async-openai = { version = "0.38.0", features = ["chat-completion"] }
bevy = { version = "0.18.1", default-features = false, features = ["multi_threaded"] }
chrono = { version = "0.4.44", features = ["clock", "serde"] }
crossbeam-channel = "0.5.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tiktoken-rs = "0.5"
toml = "0.8"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
